spring:
  application:
    name: hrms
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:h2:mem:hrms;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SUPABASE_DB_USERNAME:sa}
    password: ${SUPABASE_DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  cache:
    type: redis

server:
  port: ${SERVER_PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app:
  overtime:
    standard-shift-hours: ${STANDARD_SHIFT_HOURS:8}
    rate-tier1-multiplier: ${OT_RATE_TIER1_MULTIPLIER:1.5}
    rate-tier1-hours: ${OT_RATE_TIER1_HOURS:2}
    rate-tier2-multiplier: ${OT_RATE_TIER2_MULTIPLIER:2.0}
    monthly-cap-hours: ${OT_MONTHLY_CAP_HOURS:60}
    max-shift-hours: ${MAX_SHIFT_HOURS:16}
  redis:
    active-workers-ttl-hours: ${ACTIVE_WORKERS_TTL_HOURS:16}
